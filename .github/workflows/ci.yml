name: "LegalIR CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history is required for runtime→release ancestry checks.
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate syntax
      run: |
        python -m compileall -q src tests scripts
        bash -n scripts/colab/run_colab_cli.sh
        bash -n scripts/modal/run_modal_cli.sh

    - name: Verify core imports
      run: |
        python -c "import src.retrieval, src.training, src.pipeline, src.release"

    - name: Run unit & integration tests
      run: |
        python -m pytest -v \
          tests/unit \
          tests/contracts \
          tests/dataset \
          tests/notebook \
          tests/parity \
          tests/leakage \
          tests/memory \
          tests/integration \
          tests/release

    - name: Check No Forbidden Fallbacks
      run: python scripts/check_no_fallbacks.py

    - name: Audit Learned Parameter Budget (< 4B)
      run: python scripts/audit_parameters.py

    - name: Verify notebooks matching
      run: |
        python scripts/check_notebook_parity.py
        python scripts/generate_notebooks.py --check-drift

    - name: Offline isolated smoke test
      run: |
        python scripts/smoke_kaggle_pipeline.py --tiny --run-mode smoke

    # Normal runtime CI: behavioral regressions only. This does NOT authorize
    # production; strict release validation runs separately on the exact
    # evidence-bearing release (see strict-release job).
    - name: Run Pre-Push Gate Verification (development validation only)
      run: python scripts/verify_prepush.py --skip-pipeline

  strict-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    # Strict check runs on the exact evidence-bearing release commit.
    # A new runtime without fresh Kaggle evidence is expected to fail here
    # while normal CI passes; after genuine evidence is bundled in an
    # evidence-only descendant, this job passes for that SHA.
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Strict current release verification (Kaggle T4x2 gate)
      run: python scripts/verify_release_approval.py --repo-root .
