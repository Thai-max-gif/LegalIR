name: "LegalIR CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate syntax
      run: |
        python -m compileall -q src tests scripts
        bash -n scripts/colab/run_colab_cli.sh

    - name: Verify core imports
      run: |
        python -c "import src.retrieval, src.training, src.pipeline, src.release"

    - name: Run unit & integration tests
      run: |
        python -m pytest -v \
          tests/unit \
          tests/contracts \
          tests/dataset \
          tests/notebook \
          tests/parity \
          tests/leakage \
          tests/memory \
          tests/integration \
          tests/release

    - name: Check No Forbidden Fallbacks
      run: python scripts/check_no_fallbacks.py

    - name: Fallback mock scan
      run: |
        python scripts/gates/run_colab_t4.py --mock --dataset-dir /tmp/dataset --output-dir /tmp/output

    - name: Parameter limit audit
      run: |
        python scripts/audit_parameters.py
        python src/release/parameter_audit.py --config configs/algorithm/legalir_v2.yaml || true

    - name: Verify notebooks matching
      run: |
        python scripts/check_notebook_parity.py
        python scripts/generate_notebooks.py --check-drift

    - name: Offline isolated smoke test
      run: |
        python scripts/smoke_kaggle_pipeline.py --tiny --run-mode smoke --working-dir /tmp/smoke_out || python scripts/smoke_kaggle_pipeline.py --tiny --run-mode smoke

    - name: Verify Release Approval Gate
      run: python scripts/verify_release_approval.py --repo-root . --allow-runtime-changes

    - name: Run Pre-Push Gate Verification
      run: python scripts/verify_prepush.py --skip-pipeline
