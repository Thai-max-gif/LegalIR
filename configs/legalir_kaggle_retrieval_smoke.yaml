extends: legalir_base.yaml
experiment:
  run_id: legalir_kaggle_retrieval_smoke
  output_dir: /kaggle/working/legalir_kaggle_retrieval_smoke
data:
  dataset_root: __SET_AT_RUNTIME__
  smoke_validation_limit: 32
retrieval:
  # A closed-corpus diagnostic only. It never replaces or certifies an
  # official released index/candidate artifact.
  smoke_corpus_chunk_limit: 512
  bm25_k: 60
  dense_k: 60
  rerank_budget: 50
  top_k: 5
  rrf_k: 60
  rrf_weights: {bm25: 1.0, dense: 1.0}
model:
  dense_model_id: bkai-foundation-models/vietnamese-bi-encoder
  dense_model_revision: auto_resolve_for_diagnostic
  reranker_id: BAAI/bge-reranker-v2-m3
  reranker_revision: auto_resolve_for_diagnostic
  max_length: 512
training:
  precision: fp16
gate:
  require_git_sha: false
  require_end_to_end: false
  require_approval: false
publish:
  enabled: false
