experiment: "reranker_lora"
base_model_name: "BAAI/bge-reranker-v2-m3"
output_dir: "artifacts/local/training/checkpoints"
loss_type: "bce"
use_lora: true
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["query", "value", "key", "dense"]
lora_r: 8
lora_alpha: 16
gradient_checkpointing: true
learning_rate: 2.0e-5
batch_size: 8
gradient_accumulation_steps: 2
max_steps: 250
warmup_ratio: 0.1
max_length: 384
precision: "bf16"
fp16: false
device: "auto"
