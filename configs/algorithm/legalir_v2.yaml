seed: 42

dataset:
  name: "legalir-task1-clean-data"
  version: "v2"
  chunking:
    macro_min_tokens: 400
    macro_max_tokens: 800
    micro_min_tokens: 100
    micro_max_tokens: 250
    fallback_min_tokens: 700
    fallback_max_tokens: 1200
    overlap_tokens: 150

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    field_weights:
      legal_number: 5.0
      title: 3.0
      article: 2.0
      body: 1.0
      url_slug: 1.5
    top_k: 100
  exact_match:
    enabled: true
    min_confidence: 0.8
  question_memory:
    min_similarity: 0.82
    top_k: 5
  dense_macro:
    model_name: "CODE4LIFEOFFICIAL/huydang-dek21-embedding-v2"
    dimension: 768
    use_pyvi: true
    top_k: 50
    max_length: 384
  hybrid_union:
    top_k_candidates: 100
    top_k_for_rerank: 30
    initial_weights:
      bm25: 1.0
      exact: 2.5
      memory: 2.0
      dense: 1.2

ranking:
  evidence:
    max_chunks_per_doc: 2
    max_chars: 1200
  reranker:
    enabled: true
    model_name: "BAAI/bge-reranker-v2-m3"
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    max_length: 384
  fusion:
    method: "rrf"
    rrf_k: 60
  selector:
    max_k: 5
    min_k: 1

evaluation:
  num_folds: 5
  candidate_cutoffs: [20, 30, 50, 100]
  doc_disjoint_val_ratio: 0.2
